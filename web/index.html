<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEALTH INFO</title>
  <meta name="theme-color" content="#0f766e">
  <!-- Opens the DNS/TLS handshake to the API while the shell parses, so the
       first call after sign-in isn't paying for the connection. Ignored in
       dev, where the API is on localhost. -->
  <link rel="preconnect" href="https://healthinfo.pythonanywhere.com" crossorigin>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <div id="app">
    <header id="topbar" hidden>
      <button id="nav-toggle" aria-label="Menu">&#9776;</button>
      <span class="brand">HEALTH INFO</span>
      <span class="spacer"></span>
      <select id="state-badge" class="badge" hidden
              aria-label="State to work in"></select>
      <span id="tenant-badge" class="badge"></span>
      <a href="#/notifications" id="bell" class="badge" hidden
         aria-label="Notifications"></a>
      <a href="#/profile" id="user-badge" class="badge"></a>
      <button id="theme-toggle" class="badge" aria-label="Toggle dark mode"></button>
    </header>
    <div id="body">
      <nav id="sidebar" hidden></nav>
      <main id="main"></main>
    </div>
  </div>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
